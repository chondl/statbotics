[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Abhijit Gupta <avgupta456@gmail.com>"]
# This is an application, not a library — there is no `backend` package to
# install. Without this, `poetry install` resolves and installs every
# dependency and then fails on the final "installing the current project" step.
package-mode = false

[tool.poetry.dependencies]
# Must be >=3.11: duckdb (added with DuckDB-over-Parquet serving) requires
# >=3.10, and the pinned release requires >=3.11, so the old ">=3.9,<3.12"
# made `poetry install` fail resolution outright — nobody could set the
# backend up from scratch. Production runs python:3.11-slim (see Dockerfile).
python = ">=3.11,<3.12"
fastapi = "^0.101.1"
python-dotenv = "^1.0.0"
uvicorn = "^0.23.2"
gunicorn = "^21.2.0"
requests = "^2.31.0"
# SQLAlchemy is kept for the declarative models in src/db/models only (they
# are introspected by the Parquet writer, the state snapshot, and the DuckDB
# schemas). The Postgres/CockroachDB driver + dialect were deleted with the
# rest of the relational code in DB retirement Phase 4.
SQLAlchemy = "^2.0.20"
attrs = "^23.1.0"
scipy = "^1.11.1"
CacheControl = "^0.13.1"
typer = {extras = ["all"], version = "^0.9.0"}
black = "^23.7.0"
flake8 = "^6.1.0"
isort = "^5.12.0"
pyright = "^1.1.324"
numpy = "1.26.4"
google-cloud-storage = "^3.1.0"
duckdb = "^1.5.4"
pyarrow = "^20.0.0"
zstandard = "^0.23"
orjson = "^3.10"

[tool.poetry.group.dev.dependencies]
pyinstrument = "^4.6.1"
vulture = "^2.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
